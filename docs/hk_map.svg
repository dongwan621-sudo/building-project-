<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="香港区域分布示意">
  <rect width="900" height="520" fill="#f4f6f8"/>
  <rect x="20" y="20" width="860" height="480" rx="12" fill="#fff" stroke="#e0ddd5"/>
  <text x="450" y="60" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1a3a5c" font-weight="700">香港区域分布示意</text>
  <text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">（原配图资源未随文档上传，以下为版式占位示意）</text>
  <!-- island -->
  <ellipse cx="620" cy="210" rx="150" ry="70" fill="#2d5a87" opacity="0.85"/>
  <text x="620" y="215" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif">港岛核心区</text>
  <!-- kowloon -->
  <ellipse cx="520" cy="300" rx="130" ry="55" fill="#c5a55a" opacity="0.9"/>
  <text x="520" y="305" text-anchor="middle" fill="#1a3a5c" font-size="15" font-family="sans-serif">九龙核心区</text>
  <!-- NT east -->
  <ellipse cx="680" cy="380" rx="120" ry="50" fill="#2e7d5b" opacity="0.85"/>
  <text x="680" y="385" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif">新界东</text>
  <!-- NT west / north -->
  <ellipse cx="320" cy="280" rx="150" ry="80" fill="#1a3a5c" opacity="0.8"/>
  <text x="320" y="275" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif">新界西 / 北部都会区</text>
  <text x="320" y="298" text-anchor="middle" fill="#e0c685" font-size="12" font-family="sans-serif">价值洼地 · 规划红利</text>
  <g font-family="sans-serif" font-size="12" fill="#666">
    <circle cx="80" cy="460" r="7" fill="#2d5a87"/><text x="95" y="464">港岛</text>
    <circle cx="160" cy="460" r="7" fill="#c5a55a"/><text x="175" y="464">九龙</text>
    <circle cx="240" cy="460" r="7" fill="#2e7d5b"/><text x="255" y="464">新界东</text>
    <circle cx="340" cy="460" r="7" fill="#1a3a5c"/><text x="355" y="464">新界西/北都</text>
  </g>
</svg>
